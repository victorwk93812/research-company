# Usage:
#   docker compose build         # or: podman-compose build
#   docker compose run --rm research
#
# The container bind-mounts the repo at /workspace and your host ~/.claude
# directory + ~/.claude.json file at /root/ so Claude Code auth, account
# state, and MCP registrations carry over from your host session.
#
# Prereq: ~/.claude.json must exist on the host as a regular file. If you've
# ever logged in to Claude Code on the host it already does. If not, run
# `touch ~/.claude.json` before bringing the container up — otherwise the
# runtime will create it as a directory and Claude Code will fail to start.
services:
  research:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-company:latest
    container_name: research-company
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TERM: ${TERM:-xterm-256color}
    volumes:
      # The ":z" suffix tells the container runtime to relabel the bind
      # source so SELinux lets the container read/write it. It is a no-op
      # on non-SELinux hosts, so it's safe to leave on everywhere.
      # The repo itself.
      - .:/workspace:z
      # Claude Code auth + per-user settings + MCP registrations live here.
      - ${HOME}/.claude:/root/.claude:z
      # Account state (which Claude Code reads on startup to decide whether
      # to run the first-run setup wizard). Without this mount the container
      # will prompt for an API key / subscription plan even though
      # .credentials.json is present.
      - ${HOME}/.claude.json:/root/.claude.json:z
    command: /bin/bash
